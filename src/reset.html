<!DOCTYPE html>
<html>
<body>
<script>
document.cookie.split(';').forEach(c => {
  const name = c.split('=')[0].trim();

  document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/';
  document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;domain=.ubc.ca';
});

document.body.innerHTML = "Cookies cleared. Reload the site.";
</script>
</body>
</html>
