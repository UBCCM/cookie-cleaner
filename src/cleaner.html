<!DOCTYPE html>
<html lang="en-ca">

<head>
<meta charset="utf-8">
<title>UBC.ca cookie cleaner - The University of British Columbia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="UBC.ca Cookie Cleaner">
<link rel="preconnect" href="https://cdn.ubc.ca" crossorigin>
<link rel="preload" href="https://cdn.ubc.ca/ubc/ubc-brand/latest/js/ubc-digital-brand.js" as="script" crossorigin="anonymous">
<meta name="author" content="">
<!-- Stylesheets -->
<style type="text/css">
/* Minimal Reset (Alternative to normalize.css) */
*, *::before, *::after {
    box-sizing: border-box;
}
/** Unit Bar background colour **/
ubc-header {
    --ubc-unit-background-color: #002145;
}

body {
    font-family: Arial, sans-serif;
}
main {
    max-width: 1200px;
    padding: 1rem;
    margin: 0 auto;
}

ul {
    list-style-type: none;
    padding: 0;
}
li {
    margin: 0.5em 0;
}
.skip-link {
    position:absolute;
    top:-50px;
    left:0;
    background:#FFF;
    color:#002145;
    border: 2px solid #002145;
    padding:8px;
    z-index:100;
    transition:top 0.2s;
}
.skip-link:focus {
    top: 0;
}

</style>
<script type="module" src="https://cdn.ubc.ca/ubc/ubc-brand/latest/js/ubc-digital-brand.js" crossorigin="anonymous" defer></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <a href="#mainContent" class="skip-link">Skip to main content</a>
    <ubc-header
        website-name="UBC.ca cookie cleaner"
    >
        <template shadowrootmode="closed">
            <style>
            :host {--logo-h:98px;--unit-h:50px}
            @media (min-width:1200px){:host{--logo-h:118px;--unit-h:60px}}
            ubc-logo-bar {height:var(--logo-h)}
            ubc-unit-bar {height:var(--unit-h)}
            </style>
            <link rel="stylesheet" href="https://cdn.ubc.ca/ubc/ubc-brand/latest/css/critical.css" crossorigin="anonymous">
            <ubc-logo-bar>
                <a href="//www.ubc.ca" aria-label="UBC Home">
                    <noscript><div class="ubc-logo"></div></noscript>
                </a>
            </ubc-logo-bar>
            <ubc-unit-bar>
                <nav aria-label="Site home">
                    <a href="/" class="ubc-unit-link">
                    <span class="ubc-unit-identifier">UBC.ca cookie cleaner</span>
                    </a>
                </nav>
            </ubc-unit-bar>
        </template>
    </ubc-header>
    <!-- Content Area -->
    <main id="mainContent">
        <h1 class="text-3xl font-bold mb-6">UBC.ca cookies cleaner</h1>
        <button class="btn btn-error btn-soft px-2 py-1" onclick="deleteAllCookies()">Delete All UBC.ca Cookies</button>
        <div class="overflow-x-auto mt-6">
            <table class="table table-zebra" id="cookieTable">
                <thead>
                <tr>
                    <th>Action</th>
                    <th>Cookie</th>
                    <th>Vendor</th>
                    <th>Purpose</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
            </div>

        <script>

        function getCookieMeta(name) {
            if (name.startsWith('_ga')) {
                return {
                vendor: 'Google Analytics',
                purpose: 'Tracks visitors and repeat visits',
                };
            }

            if (name.startsWith('_gid')) {
                return {
                vendor: 'Google Analytics',
                purpose: 'Short-term visitor tracking',
                };
            }

            if (name.startsWith('_fbp')) {
                return {
                vendor: 'Facebook Pixel',
                purpose: 'Ad and campaign tracking',
                };
            }

            if (name.startsWith('_gcl') || name.startsWith('__gsas')) {
                return {
                vendor: 'Google Ads',
                purpose: 'Conversion tracking',
                };
            }

            if (name.startsWith('_hj')) {
                return {
                vendor: 'Hotjar',
                purpose: 'Session recording / heatmaps',
                };
            }

            if (name.startsWith('_tt') || name.startsWith('ttcsid')) {
                return {
                    vendor: 'TikTok Pixel',
                    purpose: 'Ad/visitor tracking',
                };
            }

            if (name.startsWith('__utm')) {
                return {
                    vendor: 'Google Analytics',
                    purpose: 'GA cookie (old version)',
                };
            }

            if (name.startsWith('_clck')) {
                return {
                    vendor: 'Microsoft Clarity',
                    purpose: 'Session tracking',
                };
            }
            if (name.startsWith('_sc') || name.startsWith('_Sc')) {
                return {
                    vendor:  'Snapchat Pixel',
                    purpose: 'Ad/visitor tracking',
                };
            }
            if (name.startsWith('_rdt_uuid') ) {
                return {
                    vendor: 'Reddit Pixel',
                    purpose: 'Ad/visitor tracking',
                }
            }
            
            if (name.startsWith('_ce') || name.startsWith('cebs')) {
                return {
                    vendor: 'Crazy Egg',
                    purpose: 'Visitor interaction tracking',
                };
            }

            return {
                vendor: 'Unknown',
                purpose: 'Likely session or tracking related',
            };
        }

        function listCookies() {
            const tbody = document.querySelector('#cookieTable tbody');
            tbody.innerHTML = '';

            const rawCookies = document.cookie;

            if (!rawCookies) {
                tbody.innerHTML = `
                <tr>
                    <td colspan="4">
                        <div class="alert alert-success alert-soft">
                            🍪 No cookies found.
                        </div>
                    </td>
                </tr>
                `;
                return;
            }

            const cookies = rawCookies.split(';').map(c => c.trim());

            cookies.forEach(cookie => {
                let [name] = cookie.split('=');
                name = name.trim();

                const meta = getCookieMeta(name);

                const tr = document.createElement('tr');

                tr.innerHTML = `
                <td class="py-2">
                    <button class="btn btn-error btn-xs btn-soft" data-name="${name}">
                    Delete
                    </button>
                </td>
                <td class="font-mono text-xs">${name}</td>
                <td class="text-sm">${meta.vendor}</td>
                <td class="text-sm">${meta.purpose}</td>
                
                `;

                tbody.appendChild(tr);
            });

            tbody.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', e => {
                deleteCookie(e.target.dataset.name);
                });
            });
        }



        function deleteCookie(name) {
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.ubc.ca`;
            listCookies();
        }

        function deleteAllCookies() {
            const cookies = document.cookie.split(';');
            cookies.forEach(cookie => {
            let [name] = cookie.split('=');
            name = name.trim();
            deleteCookie(name);
            });
        }

        // Run immediately
        listCookies();
        </script>

    </main>
    <!-- End of Content Area -->
    <ubc-footer></ubc-footer>
</body>
</html>
